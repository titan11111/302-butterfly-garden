<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>夜の庭 — 蝶のアトリエ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120b2e; --ink:#ece6ff; --dim:rgba(236,230,255,.62); --panel:rgba(24,15,56,.78);
  --line:rgba(236,230,255,.16); --gold:#ffd98a; --gold-ink:#2a1a08; --chip:rgba(255,255,255,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:rgba(20,12,48,.8); --chip:rgba(255,255,255,.06); }
}
:root[data-theme="dark"]{ --panel:rgba(20,12,48,.8); }
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
html{height:100%;width:100%;scroll-padding-top:env(safe-area-inset-top,0px);overflow:hidden;overscroll-behavior:none}
body{height:100%;width:100%;margin:0;position:fixed;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Klee One','Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
::selection{background:transparent;color:inherit}
#c{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.hud{position:fixed;top:0;left:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0;pointer-events:none}
.hud h1{margin:0;font-size:1.4rem;font-weight:600;letter-spacing:.14em;text-shadow:0 0 18px rgba(190,170,255,.7)}
.hud p{margin:.25rem 0 0;font-size:.82rem;color:var(--dim)}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);margin:0;text-align:center;
  font-size:.85rem;color:var(--dim);pointer-events:none;transition:opacity 1.4s}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  border:1px solid rgba(255,217,138,.55);background:rgba(30,18,64,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:.8rem 1.6rem;border-radius:999px;font-size:1rem;letter-spacing:.08em;cursor:pointer;
  box-shadow:0 0 24px rgba(255,217,138,.25);transition:opacity .3s}
.fab.hide{opacity:0;pointer-events:none}

.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:74%;overflow-y:auto;
  background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;
  padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{margin:0;font-size:1.1rem;font-weight:600;letter-spacing:.1em}
.x{border:none;background:none;font-size:1.5rem;line-height:1;padding:.2rem .5rem;cursor:pointer;color:var(--dim)}
.preview{position:relative;margin:.4rem 0 .2rem;text-align:center}
#preview{width:100%;height:150px;display:block;cursor:pointer}
#pname{margin:.1rem 0 0;font-size:1.05rem;letter-spacing:.12em;color:var(--gold)}
.small{margin:.15rem 0 0;font-size:.74rem;color:var(--dim)}
.group{margin-top:1rem}
.label{display:block;font-size:.86rem;color:var(--dim);margin-bottom:.45rem}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.45rem}
.slots{display:flex;gap:.55rem}
.slot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.slot.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,217,138,.25),0 0 14px rgba(255,217,138,.4)}
#pad{width:100%;height:112px;display:block;border-radius:14px;touch-action:none;cursor:crosshair}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:.42rem .95rem;font-size:.9rem;cursor:pointer}
.chip.on{border-color:var(--gold);background:rgba(255,217,138,.15);color:var(--gold)}
.slider{display:grid;grid-template-columns:5.2em 1fr 4.4em;align-items:center;gap:.5rem;font-size:.82rem;color:var(--dim);margin:.35rem 0}
.slider span:last-child{text-align:right}
input[type=range]{width:100%;accent-color:var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:.7rem;margin-top:1.2rem}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:16px;padding:.9rem;font-size:1rem;cursor:pointer}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600;letter-spacing:.2em;
  box-shadow:0 0 22px rgba(255,217,138,.45)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-8px);
  background:rgba(24,15,56,.8);border:1px solid rgba(255,217,138,.4);padding:.55rem 1.1rem;border-radius:999px;
  font-size:.88rem;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.95rem;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" aria-label="蝶が舞う夜の庭"></canvas>
<div class="loading" id="loading">庭に灯りをともしています…</div>
<header class="hud">
  <h1>夜の庭</h1>
  <p id="count"></p>
</header>
<p class="hint" id="hint">タップした場所に蝶が集まります　ドラッグで庭を見まわせます</p>
<button class="fab" id="openBtn" aria-controls="atelier" aria-expanded="false">🦋 蝶をつくる</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<section class="sheet" id="atelier" aria-label="蝶のアトリエ">
  <div class="sheet-head">
    <h2>蝶のアトリエ</h2>
    <button class="x" id="closeBtn" aria-label="アトリエを閉じる">×</button>
  </div>
  <div class="preview">
    <canvas id="preview" width="600" height="300" tabindex="0" aria-label="いまの蝶のプレビュー。タップで模様がゆらぎます"></canvas>
    <p id="pname"></p>
    <p class="small">羽をタップすると、模様の出かたがゆらぎます</p>
  </div>

  <div class="group">
    <div class="row">
      <span class="label" style="margin:0">色をまぜる</span>
      <div class="slots" id="slots"></div>
    </div>
    <canvas id="pad" aria-label="色のパレット。選んだ丸の色を指でなぞって変えます"></canvas>
    <label class="slider"><span>くっきり</span><input id="blend" type="range" min="0" max="1" step="0.01"><span>とろける</span></label>
  </div>

  <div class="group">
    <span class="label">模様</span>
    <div class="chips" id="patterns"></div>
  </div>

  <div class="group">
    <span class="label">羽のかたち</span>
    <div class="chips" id="shapes"></div>
  </div>

  <div class="group">
    <label class="slider"><span>模様の量</span><input id="density" type="range" min="0" max="1" step="0.01"><span>たっぷり</span></label>
    <label class="slider"><span>ひかり</span><input id="glow" type="range" min="0" max="1" step="0.01"><span>まばゆい</span></label>
    <label class="slider"><span>大きさ</span><input id="size" type="range" min="0.6" max="1.5" step="0.01"><span>おおきい</span></label>
  </div>

  <div class="actions">
    <button class="btn" id="randBtn">おまかせ</button>
    <button class="btn primary" id="releaseBtn">放つ</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';
document.addEventListener('touchmove',e=>{ if(!e.target.closest('.sheet')) e.preventDefault(); },{passive:false});
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;},{passive:false});
const TAU = Math.PI*2, V3 = THREE.Vector3;
const $ = s => document.querySelector(s);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const hsl = (c,a=1,dl=0)=>`hsla(${Math.round(c.h)},88%,${clamp(c.l+dl,4,96)}%,${a})`;

/* ---------- names ---------- */
const PATTERNS = [['stripe','縞'],['dots','星くず'],['vein','葉脈'],['marble','流紋'],['aurora','オーロラ']];
const SHAPES = [['round','まるい'],['pointed','とがる'],['tail','尾つき']];
const hueNames=[[14,'紅'],[32,'茜'],[52,'琥珀'],[75,'金糸'],[135,'若葉'],[172,'翡翠'],[200,'水鏡'],[232,'瑠璃'],[262,'群青'],[292,'藤'],[330,'桃'],[361,'紅']];
const patName={eye:'眼紋',stripe:'縞',dots:'星斑',vein:'葉脈',marble:'流紋',aurora:'極光'};
const shapeName={round:'シジミ',pointed:'タテハ',tail:'アゲハ'};
function makeName(p){
  const c=p.cols[0]; const hn=hueNames.find(x=>c.h<x[0])[1];
  const pre = c.l>72?'淡':(c.l<36?'夜':'');
  return pre+hn+patName[p.pattern]+shapeName[p.shape];
}

/* ---------- wing painting ---------- */
function wingPath(g,part,shape){
  g.beginPath();
  if(part==='fore'){
    g.moveTo(4,120);
    if(shape==='round'){ g.bezierCurveTo(50,50,160,8,226,22); g.bezierCurveTo(254,52,238,112,198,138); g.bezierCurveTo(140,150,60,146,4,138); }
    else { g.bezierCurveTo(60,56,176,14,252,8); g.bezierCurveTo(232,58,212,108,182,138); g.bezierCurveTo(124,148,60,146,4,138); }
  } else {
    g.moveTo(4,134);
    if(shape==='round'){ g.bezierCurveTo(90,128,196,146,204,188); g.bezierCurveTo(210,234,150,252,100,238); g.bezierCurveTo(48,222,18,182,4,150); }
    else if(shape==='pointed'){ g.bezierCurveTo(90,128,176,150,180,194); g.bezierCurveTo(176,226,122,238,82,222); g.bezierCurveTo(40,206,14,176,4,150); }
    else { g.bezierCurveTo(90,128,184,148,184,186); g.bezierCurveTo(184,206,168,214,158,218); g.lineTo(154,254); g.lineTo(136,224); g.bezierCurveTo(92,232,38,206,4,150); }
  }
  g.closePath();
}
function paintWing(part,p){
  const S=256, cv=document.createElement('canvas'); cv.width=cv.height=S;
  const g=cv.getContext('2d');
  const r=mulberry32(p.seed + (part==='fore'?11:977));
  if(p.pattern==='eye') p.pattern='dots';
  const [c1,c2,c3]=p.cols, d=p.density, fore=part==='fore';
  wingPath(g,part,p.shape); g.save(); g.clip();
  // base mixing
  const sharp=1-p.blend;
  const grd=g.createRadialGradient(0,128,4,0,128,fore?250:215);
  grd.addColorStop(0,hsl(c1)); grd.addColorStop(0.1+0.28*sharp,hsl(c1));
  grd.addColorStop(0.5,hsl(c2)); grd.addColorStop(0.9-0.28*sharp,hsl(c3)); grd.addColorStop(1,hsl(c3,1,-8));
  g.fillStyle=grd; g.fillRect(0,0,S,S);
  // pattern
  const dark='rgba(14,7,30,.72)';
  g.lineCap='round';
  if(p.pattern==='eye'){
    const n=1+Math.round(d*2);
    for(let i=0;i<n;i++){
      const x=fore?120+r()*90:80+r()*80, y=fore?36+r()*70:168+r()*46, R=(fore?9:13)+r()*12+d*6;
      [[1.32,'rgba(12,6,26,.85)'],[1,hsl(c1,1,22)],[.74,hsl(c3,1,-18)],[.42,'#0b0616']].forEach(([k,col])=>{g.fillStyle=col;g.beginPath();g.arc(x,y,R*k,0,TAU);g.fill();});
      g.fillStyle='rgba(255,255,255,.92)'; g.beginPath(); g.arc(x-R*.14,y-R*.16,R*.14,0,TAU); g.fill();
    }
  } else if(p.pattern==='stripe'){
    const n=3+Math.round(d*7);
    for(let i=0;i<n;i++){
      const rad=26+(i+.5)*(230/n)+(r()-.5)*8;
      g.lineWidth=3+r()*9*(.4+d); g.strokeStyle= i%2?hsl(c3,.85,12):dark;
      g.beginPath(); g.arc(0,128,rad,-1.6,1.6); g.stroke();
    }
  } else if(p.pattern==='dots'){
    const n=24+Math.floor(d*100);
    for(let i=0;i<n;i++){
      const x=r()*240+6, y=r()*250, rr=1.2+r()*4.5;
      g.fillStyle= r()<.55?'rgba(255,255,255,.9)':hsl(c3,.95,20);
      g.beginPath(); g.arc(x,y,rr,0,TAU); g.fill();
    }
  } else if(p.pattern==='vein'){
    const n=6+Math.round(d*8);
    const a0=fore?-1.35:.05, a1=fore?.12:1.4;
    for(let i=0;i<n;i++){
      const a=a0+(a1-a0)*(i/(n-1))+(r()-.5)*.08, L=270;
      const ex=Math.cos(a)*L, ey=128+Math.sin(a)*L, mx=Math.cos(a+.12)*L*.5, my=128+Math.sin(a+.12)*L*.5;
      g.strokeStyle=dark; g.lineWidth=2.2+d*4;
      g.beginPath(); g.moveTo(0,128); g.quadraticCurveTo(mx,my,ex,ey); g.stroke();
    }
    g.fillStyle=hsl(c1,.35,25);
    for(let i=0;i<n*2;i++){g.beginPath();g.arc(40+r()*190,r()*256,6+r()*10,0,TAU);g.fill();}
  } else if(p.pattern==='marble'){
    const n=4+Math.round(d*10), cs=[c1,c2,c3];
    for(let i=0;i<n;i++){
      g.strokeStyle=hsl(cs[i%3],.55,(r()-.5)*40); g.lineWidth=5+r()*22;
      g.beginPath(); g.moveTo(r()*256,r()*256);
      g.bezierCurveTo(r()*256,r()*256,r()*256,r()*256,r()*256,r()*256); g.stroke();
    }
  } else if(p.pattern==='aurora'){
    g.globalCompositeOperation='screen';
    const n=3+Math.round(d*5);
    for(let i=0;i<n;i++){
      const y0=r()*256, amp=10+r()*26, f=.02+r()*.03, ph=r()*TAU;
      g.strokeStyle=`hsla(${(c1.h+i*38)%360},95%,68%,.45)`; g.lineWidth=10+r()*18;
      g.beginPath();
      for(let x=0;x<=256;x+=8){ const y=y0+Math.sin(x*f+ph)*amp; x?g.lineTo(x,y):g.moveTo(x,y); }
      g.stroke();
    }
    g.globalCompositeOperation='source-over';
  }
  // fine veins
  if(p.pattern!=='vein'){
    g.strokeStyle='rgba(14,7,30,.28)'; g.lineWidth=1.3;
    for(let i=0;i<7;i++){ const a=(fore?-1.3:.1)+i*.2; g.beginPath(); g.moveTo(0,128); g.lineTo(Math.cos(a)*270,128+Math.sin(a)*270); g.stroke(); }
  }
  // scale shimmer
  for(let i=0;i<260;i++){ g.fillStyle=`rgba(255,255,255,${.04+r()*.06})`; g.fillRect(r()*256,r()*256,1.5,1.5); }
  const sh=g.createLinearGradient(0,0,256,256); sh.addColorStop(0,'rgba(255,255,255,0)'); sh.addColorStop(.5,'rgba(255,255,255,.14)'); sh.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=sh; g.fillRect(0,0,256,256);
  // hairy base
  const hb=g.createRadialGradient(0,128,0,0,128,56); hb.addColorStop(0,'rgba(18,9,34,.75)'); hb.addColorStop(1,'rgba(18,9,34,0)');
  g.fillStyle=hb; g.fillRect(0,0,256,256);
  // margin
  wingPath(g,part,p.shape); g.lineWidth=13; g.strokeStyle='rgba(14,7,30,.82)'; g.stroke();
  wingPath(g,part,p.shape); g.lineWidth=3; g.strokeStyle=hsl(c3,.55,30); g.stroke();
  g.restore();
  return cv;
}

/* ---------- params ---------- */
let seedCounter = (Math.random()*1e9)|0;
function randomParams(){
  const h1=Math.random()*360, h2=(h1+60+Math.random()*120)%360, h3=Math.random()*360;
  return {
    cols:[{h:h1,l:52+Math.random()*28},{h:h2,l:42+Math.random()*28},{h:h3,l:32+Math.random()*38}],
    blend:Math.random(), pattern:PATTERNS[(Math.random()*PATTERNS.length)|0][0],
    shape:SHAPES[(Math.random()*SHAPES.length)|0][0],
    density:.25+Math.random()*.6, glow:.4+Math.random()*.5, size:.8+Math.random()*.45, seed:++seedCounter
  };
}
const clone = o=>JSON.parse(JSON.stringify(o));

/* ---------- renderer / scene ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x1b1044,0.032);
{
  const sc=document.createElement('canvas'); sc.width=2; sc.height=256; const g=sc.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256); gr.addColorStop(0,'#07051a'); gr.addColorStop(.45,'#1d1150'); gr.addColorStop(.75,'#3a1d6b'); gr.addColorStop(1,'#5a2a74');
  g.fillStyle=gr; g.fillRect(0,0,2,256); scene.background=new THREE.CanvasTexture(sc);
}
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,200);
const cam={theta:.5,phi:1.28,r:17,tgt:new V3(0,3.2,0)};
function placeCam(){
  camera.position.set(cam.tgt.x+cam.r*Math.sin(cam.phi)*Math.sin(cam.theta), cam.tgt.y+cam.r*Math.cos(cam.phi), cam.tgt.z+cam.r*Math.sin(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.tgt);
}
placeCam();

scene.add(new THREE.HemisphereLight(0x9a8cff,0x1a0f30,.75));
const moonLight=new THREE.DirectionalLight(0xd6dcff,.75); moonLight.position.set(-20,22,-30); scene.add(moonLight);
const pl1=new THREE.PointLight(0xff9ad8,1.3,20); pl1.position.set(4,3,2); scene.add(pl1);
const pl2=new THREE.PointLight(0x6ff2e0,1.1,20); pl2.position.set(-5,2.5,-3); scene.add(pl2);

function softTex(inner,outer,size=128){
  const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2); gr.addColorStop(0,inner); gr.addColorStop(.35,outer); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,size,size); return new THREE.CanvasTexture(c);
}
const dotTex=softTex('rgba(255,255,255,1)','rgba(255,255,255,.35)',64);

// moon
{
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex('rgba(255,250,235,1)','rgba(220,210,255,.35)',256),fog:false,depthWrite:false,transparent:true}));
  m.position.set(-22,26,-45); m.scale.set(16,16,1); scene.add(m);
}
// stars
{
  const n=700, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const th=Math.random()*TAU, ph=Math.random()*1.25, R=70;
    pos[i*3]=R*Math.sin(ph)*Math.cos(th); pos[i*3+1]=R*Math.cos(ph)+4; pos[i*3+2]=R*Math.sin(ph)*Math.sin(th); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));

class Particles{
  constructor(n,size){
    this.n=n; this.i=0;
    this.pos=new Float32Array(n*3).fill(-999); this.col=new Float32Array(n*3); this.base=new Float32Array(n*3);
    this.vel=new Float32Array(n*3); this.life=new Float32Array(n); this.max=new Float32Array(n).fill(1);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(this.pos,3)); g.setAttribute('color',new THREE.BufferAttribute(this.col,3));
    this.geo=g;
    this.points=new THREE.Points(g,new THREE.PointsMaterial({size,map:dotTex,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
    this.points.frustumCulled=false; scene.add(this.points);
  }
  spawn(p,c,v,life){
    const k=this.i++%this.n, j=k*3;
    this.pos[j]=p.x; this.pos[j+1]=p.y; this.pos[j+2]=p.z;
    this.vel[j]=v.x; this.vel[j+1]=v.y; this.vel[j+2]=v.z;
    this.base[j]=c.r; this.base[j+1]=c.g; this.base[j+2]=c.b; this.life[k]=life; this.max[k]=life;
  }
  update(dt){
    for(let k=0;k<this.n;k++){
      const j=k*3;
      if(this.life[k]>0){
        this.life[k]-=dt; const f=Math.max(0,this.life[k]/this.max[k]);
        this.pos[j]+=this.vel[j]*dt; this.pos[j+1]+=this.vel[j+1]*dt; this.pos[j+2]+=this.vel[j+2]*dt;
        this.vel[j]*=.985; this.vel[j+1]=this.vel[j+1]*.985+.05*dt; this.vel[j+2]*=.985;
        const a=f*Math.min(1,(1-f)*6);
        this.col[j]=this.base[j]*a; this.col[j+1]=this.base[j+1]*a; this.col[j+2]=this.base[j+2]*a;
      } else { this.col[j]=this.col[j+1]=this.col[j+2]=0; }
    }
    this.geo.attributes.position.needsUpdate=true; this.geo.attributes.color.needsUpdate=true;
  }
}

class Butterfly{
  constructor(p,pos,vel){
    this.p=p; const s=p.size;
    this.group=new THREE.Group(); this.inner=new THREE.Group(); this.group.add(this.inner);
    this.tex=[paintWing('fore',p),paintWing('hind',p)].map(c=>new THREE.CanvasTexture(c));
    this.mats=this.tex.map(t=>new THREE.MeshStandardMaterial({map:t,emissiveMap:t,emissive:0xffffff,emissiveIntensity:.12+p.glow*.95,transparent:true,alphaTest:.4,side:THREE.DoubleSide,roughness:.5,metalness:.15}));
    this.wings=[];
    const W=1.1*s;
    for(const side of [1,-1]) for(let h=0;h<2;h++){
      const pv=new THREE.Group(); pv.scale.set(side,1,1); pv.position.z=h?-.03*s:.02*s;
      const m=new THREE.Mesh(wingGeo,this.mats[h]); m.scale.setScalar(W*(h?.92:1)); pv.add(m);
      this.inner.add(pv); this.wings.push({pv,side,hind:!!h});
    }
    const c0=new THREE.Color().setHSL(p.cols[0].h/360,.7,.3);
    this.bodyMat=new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(p.cols[2].h/360,.3,.1),emissive:c0,emissiveIntensity:.45,roughness:.85});
    const part=(sx,sy,sz,z)=>{const m=new THREE.Mesh(sphGeo,this.bodyMat); m.scale.set(sx*s,sy*s,sz*s); m.position.z=z*s; this.inner.add(m);};
    part(.065,.065,.13,0); part(.05,.048,.3,-.34); part(.055,.055,.055,.15);
    antGeos.forEach((g,i)=>{ const a=new THREE.Mesh(g,this.bodyMat); a.scale.setScalar(s); this.inner.add(a);
      const tip=new THREE.Mesh(sphGeo,this.bodyMat); tip.scale.setScalar(.018*s); tip.position.set((i?-.15:.15)*s,.15*s,.48*s); this.inner.add(tip); });
    const pg=new THREE.Group(); pg.position.set(0,-.02*s,.19*s); pg.rotation.x=2.3;
    const pm=new THREE.Mesh(probeGeo,this.bodyMat); pg.add(pm); this.inner.add(pg); this.proboscis=pg; this.probe=0; pg.scale.set(s,.001,s);
    this.pos=pos.clone(); this.vel=vel.clone(); this.group.position.copy(pos);
    this.target=randTarget(); this.retarget=1+Math.random()*3;
    this.ph=Math.random()*TAU; this.phase=this.ph; this.freq=(2.1+Math.random()*1.1)/Math.sqrt(s);
    this.speed=(.75+Math.random()*.45)/Math.pow(s,.3);
    this.leaving=false; this.fade=1; this.dead=false;
    this.mode='fly'; this.glide=0; this.burst=1; this.lastYaw=Math.atan2(vel.x,vel.z); this.roll=0; this.emit=0;
    this.q=new THREE.Quaternion(); this.e=new THREE.Euler(); this.col=[new THREE.Color(hsl(p.cols[0],1,10)),new THREE.Color(hsl(p.cols[2],1,15))];
    this.group.rotation.y=this.lastYaw;
  }
  leaveFlower(){ if(this.flower){ this.flower.busy=null; this.flower=null; } }
  leave(){
    this.leaving=true; this.leaveFlower(); this.mode='fly';
    const out=new V3(this.pos.x,0,this.pos.z); if(out.lengthSq()<.01) out.set(1,0,0); out.normalize();
    this.leaveDir=out.multiplyScalar(1.1).add(new V3(0,.9,0));
    this.mats.forEach(m=>{m.alphaTest=.02;m.needsUpdate=true;}); this.bodyMat.transparent=true; this.bodyMat.needsUpdate=true;
  }
  update(dt,t){
    const s=this.p.size; let ang, lag;

      this.phase+=dt*this.freq*TAU;
      this.pos.addScaledVector(this.vel,dt); this.group.position.copy(this.pos);
      this.e.set(-.45,Math.atan2(this.vel.x,this.vel.z),0,'YXZ'); this.q.setFromEuler(this.e); this.group.quaternion.slerp(this.q,Math.min(1,dt*2));
      const a=.5+.9*Math.sin(this.phase), l=.5+.82*Math.sin(this.phase-.6);
      for(const w of this.wings) w.pv.rotation.z=w.side*(w.hind?l:a);
      this.inner.position.y=-Math.sin(this.phase)*.12*s;
      const o=Math.max(0,this.fade); this.mats.forEach(m=>m.opacity=o); this.bodyMat.opacity=o;
      if(this.fade<=0){ this.dispose(); this.dead=true; }

    }
    if(attr.t>0 && this.mode!=='fly'){ this.leaveFlower(); this.mode='fly'; }
    if(this.mode==='rest'){
      this.restT-=dt;
      this.pos.lerp(this.perch,Math.min(1,dt*5)); this.group.position.copy(this.pos);
      this.e.set(0,this.restYaw,0,'YXZ'); this.q.setFromEuler(this.e); this.group.quaternion.slerp(this.q,Math.min(1,dt*3));

      lag = ang-.03;

      if(this.restT<=0){ this.leaveFlower(); this.mode='fly'; this.target=randTarget(); this.target.y=this.pos.y+2.5; this.vel.set(0,1.2,0); this.burst=1.2; }
    } else {
      this.retarget-=dt;
      if(attr.t>0){
        this.target.set(attr.pos.x+Math.cos(t*1.1+this.ph)*1.8, attr.pos.y+Math.sin(t*1.6+this.ph*2)*.9, attr.pos.z+Math.sin(t*1.1+this.ph)*1.8);
      } else if(this.retarget<=0 && this.mode==='fly'){
        this.retarget=4+Math.random()*5;
        const free=flowers.filter(f=>!f.busy);
        if(free.length && Math.random()<.3){ this.flower=free[(Math.random()*free.length)|0]; this.flower.busy=this; this.mode='land'; this.target.copy(this.flower.perch); }
        else this.target=randTarget();

      if(this.mode==='land' && d<.3){

      const des=to.normalize().multiplyScalar(sp);
      if(this.mode==='fly'){ des.x+=Math.sin(t*.6+this.ph)*.35; des.y+=Math.sin(t*.9+this.ph*2)*.3; des.z+=Math.cos(t*.5+this.ph)*.35; }

      else { this.phase+=dt*this.freq*TAU; this.burst-=dt; this.vel.y+=Math.cos(this.phase)*.8*dt;
        if(this.burst<=0){ if(this.mode==='fly'&&Math.random()<.65) this.glide=.6+Math.random()*1.4; else this.burst=.5+Math.random(); } }
      if(this.pos.y<.5) this.vel.y+=2.5*dt;
      this.pos.addScaledVector(this.vel,dt); this.group.position.copy(this.pos);
      if(this.vel.lengthSq()>.0004){
        const yaw=Math.atan2(this.vel.x,this.vel.z); let dy=yaw-this.lastYaw; dy=((dy+Math.PI)%TAU+TAU)%TAU-Math.PI; this.lastYaw=yaw;

    }
    if(this.mode!=='rest') this.probe+=(0-this.probe)*Math.min(1,dt*4);
    this.proboscis.scale.set(s,Math.max(.001,this.probe)*s,s);
    this.wingAng=ang;
    for(const w of this.wings) w.pv.rotation.z=w.side*(w.hind?lag:ang);

    if(this.emit>(this.mode==='rest'?1.2:.28)){ this.emit=0;

  }
  dispose(){ this.leaveFlower(); scene.remove(this.group); this.tex.forEach(t=>t.dispose()); this.mats.forEach(m=>m.dispose()); this.bodyMat.dispose(); }
}

  const o=ray.ray.origin, d=ray.ray.direction; let tt=d.y<-.01?(3-o.y)/d.y:12; tt=clamp(tt,4,26);
  const p=o.clone().addScaledVector(d,tt); p.x=clamp(p.x,-13,13); p.z=clamp(p.z,-11,11); p.y=clamp(p.y,1.2,8);

}
const pad=$('#pad'), pctx=pad.getContext('2d');
function sizePad(){ const dpr=Math.min(devicePixelRatio||1,2); pad.width=Math.max(1,pad.clientWidth*dpr); pad.height=Math.max(1,pad.clientHeight*dpr); drawPad(); }
function drawPad(){
  const w=pad.width,h=pad.height,g=pctx; if(!w) return;
  const hg=g.createLinearGradient(0,0,w,0); for(let i=0;i<=12;i++) hg.addColorStop(i/12,`hsl(${i*30},88%,57%)`);
  g.fillStyle=hg; g.fillRect(0,0,w,h);
  const vg=g.createLinearGradient(0,0,0,h); vg.addColorStop(0,'rgba(255,255,255,.82)'); vg.addColorStop(.5,'rgba(255,255,255,0)'); vg.addColorStop(.5,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(10,5,26,.85)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
  const dpr=w/pad.clientWidth;
  cur.cols.forEach((c,i)=>{ const x=c.h/360*w, y=(90-c.l)/66*h;
    g.beginPath(); g.arc(x,y,(i===active?13:9)*dpr,0,TAU); g.fillStyle=hsl(c); g.fill();
    g.lineWidth=(i===active?3:2)*dpr; g.strokeStyle=i===active?'#fff':'rgba(255,255,255,.7)'; g.stroke(); });
}
function padSet(e){ const r=pad.getBoundingClientRect(); const x=clamp((e.clientX-r.left)/r.width,0,1), y=clamp((e.clientY-r.top)/r.height,0,1);
  cur.cols[active]={h:x*360,l:90-y*66}; syncUI(); drawPad(); needPreview=true; }
let padDown=false;
pad.addEventListener('pointerdown',e=>{ padDown=true; pad.setPointerCapture(e.pointerId);
  // pick nearest marker if touching one
  const r=pad.getBoundingClientRect(); let best=-1,bd=24;
  cur.cols.forEach((c,i)=>{ const d=Math.hypot(r.left+c.h/360*r.width-e.clientX, r.top+(90-c.l)/66*r.height-e.clientY); if(d<bd){bd=d;best=i;} });
  if(best>=0) active=best; padSet(e); });
pad.addEventListener('pointermove',e=>{ if(padDown) padSet(e); });
pad.addEventListener('pointerup',()=>padDown=false); pad.addEventListener('pointercancel',()=>padDown=false);

const pv=$('#preview'), pvx=pv.getContext('2d');
const reroll=()=>{ cur.seed=++seedCounter; needPreview=true; };
pv.addEventListener('click',reroll); pv.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); reroll(); } });
function drawPreview(t){
  if(needPreview){ pwings=[paintWing('fore',cur),paintWing('hind',cur)]; $('#pname').textContent=makeName(cur); needPreview=false; }
  const W=pv.width,H=pv.height,cx=W/2,cy=H/2+6,k=1.05*(.8+cur.size*.2),g=pvx;
  g.clearRect(0,0,W,H);
  const bg=g.createRadialGradient(cx,cy,10,cx,cy,H*.8); bg.addColorStop(0,`hsla(${cur.cols[0].h},80%,60%,${.12+cur.glow*.2})`); bg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  const f=reduceMotion?1:.72+.28*Math.cos(t*2.2), S=256*k;
  for(const side of [1,-1]){ g.save(); g.translate(cx,0); g.scale(side*f,1);
    g.drawImage(pwings[1],0,cy-128*k,S,S); g.drawImage(pwings[0],0,cy-128*k,S,S); g.restore(); }
  g.fillStyle='#1a0f2c'; g.beginPath(); g.ellipse(cx,cy+30*k,6*k,46*k,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(cx,cy-18*k,7*k,14*k,0,0,TAU); g.fill();
  g.strokeStyle='#1a0f2c'; g.lineWidth=2;
  for(const s of [1,-1]){ g.beginPath(); g.moveTo(cx,cy-30*k); g.quadraticCurveTo(cx+s*10*k,cy-60*k,cx+s*22*k,cy-74*k); g.stroke(); }
}
$('#randBtn').onclick=()=>{ cur=randomParams(); syncUI(); drawPad(); needPreview=true; };
const toastEl=$('#toast'); let toastTimer;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2400); }
$('#releaseBtn').onclick=()=>{
  const p=clone(cur); p.name=makeName(p);
  const dir=new V3(); camera.getWorldDirection(dir);
  const sp=camera.position.clone().addScaledVector(dir,5); sp.y-=1;
  const gone=addButterfly(p,sp,dir.clone().multiplyScalar(.8).add(new V3(0,.8,0)));
  const cs=[new THREE.Color(hsl(p.cols[0])),new THREE.Color(hsl(p.cols[1])),new THREE.Color(hsl(p.cols[2]))];
  for(let i=0;i<60;i++){ const a=Math.random()*TAU,b=Math.random()*Math.PI,v=.6+Math.random()*1.6;
    pollen.spawn(sp,cs[i%3],{x:Math.sin(b)*Math.cos(a)*v,y:Math.cos(b)*v,z:Math.sin(b)*Math.sin(a)*v},1+Math.random()); }
  save(); toast(gone?`${gone.p.name||'蝶'}が旅立ち、${p.name}がやってきました`:`${p.name}を放ちました`);
  cur.seed=++seedCounter; needPreview=true;
  openSheet(false);
};

/* ---------- boot ---------- */
const saved=load();
if(saved){ saved.slice(-MAX).forEach(p=>{ if(p.pattern==='eye'){ p.pattern='dots'; p.name=makeName(p); } seedCounter=Math.max(seedCounter,p.seed||0); addButterfly(p,randTarget(),new V3((Math.random()-.5),0,(Math.random()-.5))); }); }
else { for(let i=0;i<7;i++){ const p=randomParams(); p.name=makeName(p); addButterfly(p,randTarget(),new V3((Math.random()-.5),0,(Math.random()-.5))); } save(); }
syncUI();
$('#loading').remove();
setTimeout(()=>{ hint.style.opacity=0; },9000);

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); if(composer) composer.setSize(w,h); if(sheet.classList.contains('open')) sizePad(); }
addEventListener('resize',resize);

const clock=new THREE.Clock(); let t=0, rf=0;
function loop(){
  requestAnimationFrame(loop);
  rf++;
  if(!sheet.classList.contains('open')&&(rf&1)) return;
  const dt=Math.min(clock.getDelta(),.05); t+=dt; idle+=dt;
  if(!reduceMotion && idle>3 && ptrs.size===0) cam.theta+=dt*.035;
  placeCam();
  if(attr.t>0) attr.t-=dt;
  for(const b of bflies) b.update(dt,t);
  for(let i=bflies.length-1;i>=0;i--) if(bflies[i].dead){ bflies.splice(i,1); updateCount(); }
  pollen.update(dt); flies.update(t);
  if(rippleT>0){ rippleT-=dt; const k=1-rippleT/1.2; ripple.scale.setScalar(.5+k*3.5); ripple.material.opacity=Math.max(0,1-k); } else ripple.material.opacity=0;
  pl1.position.x=4+Math.sin(t*.3)*2; pl2.position.z=-3+Math.cos(t*.25)*2;
  if(sheet.classList.contains('open')) drawPreview(t);
  if(composer && sheet.classList.contains('open')) composer.render();
  else renderer.render(scene,camera);
}
loop();
})();
</script>
</body>
